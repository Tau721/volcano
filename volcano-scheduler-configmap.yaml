apiVersion: v1
kind: ConfigMap
metadata:
  name: volcano-scheduler-configmap
  namespace: volcano-system
data:
  volcano-scheduler.conf: |
    actions: "enqueue, allocate, backfill"
    tiers:
    - plugins:
      - name: priority
      - name: gang
        enablePreemptable: false
      - name: conformance
    - plugins:
      - name: drf
        enablePreemptable: false
      - name: predicates
      - name: capacity
      - name: nodeorder
        arguments:
          # 满足 nodeAffinity/nodeSelector 的节点得分更高
          nodeaffinity.weight: 2
          # 与已有 Pod 亲和性更好的节点得分更高
          podaffinity.weight: 2
          # 优先空闲节点；紧凑装箱场景关闭，避免与 binpack 抵消
          leastrequested.weight: 0
          # 优先资源请求率高的已用节点；与 binpack 重复，关闭
          mostrequested.weight: 0
          # CPU/内存使用率越均衡得分越高（不含昇腾资源）
          balancedresource.weight: 1
          # 优先没有不可容忍的 PreferNoSchedule 污点的节点
          tainttoleration.weight: 3
          # 优先本地已有镜像的节点
          imagelocality.weight: 1
          # 优先各拓扑域分布更均匀的节点
          podtopologyspread.weight: 2
      - name: binpack
        arguments:
          binpack.weight: 10
          binpack.cpu: 1
          binpack.memory: 1
          binpack.resources: huawei.com/ascend-1980
          binpack.resources.huawei.com/ascend-1980: 2
      - name: network-topology-aware
        arguments:
          weight: 10
