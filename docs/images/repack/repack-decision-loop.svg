<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" role="img">
  <title>Repack 从 DryRun 到 Execute 的安全决策闭环</title>
  <desc>用户创建 DryRun 后，Repack 依次检查驱逐范围、确定性零中断 PDB、调度可行性、中断影响和执行预算，输出评估结论与计划。用户审核 status.plan 后新建 Execute，Execute 根据实时状态重新规划，再执行 Eviction、写入 nominatedNodeName 和结果验证，最终把实际结果写入 status.result 和 status.relocations。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1c7ed6"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2f9e44"/></marker></defs>
  <rect width="1120" height="420" fill="#fff"/>
  <text x="32" y="32" font-size="17" font-weight="700" fill="#1f2328">从 DryRun 到 Execute：先评估计划，再执行受控迁移</text>
  <text x="32" y="56" font-size="11" fill="#57606a">DryRun 与 Execute 使用同一套规划逻辑；Execute 会基于实时状态重新计算，不会照搬一份已经过期的计划。</text>

  <rect x="36" y="104" width="172" height="112" rx="11" fill="#eaf4ff" stroke="#1c7ed6"/>
  <text x="122" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">① 创建 DryRun</text>
  <text x="122" y="156" text-anchor="middle" font-size="9.8" fill="#57606a">目标资源 · Scope</text>
  <text x="122" y="175" text-anchor="middle" font-size="9.8" fill="#57606a">收益门槛 · maxPerRun</text>
  <text x="122" y="199" text-anchor="middle" font-size="9.8" font-weight="700" fill="#1c7ed6">不会驱逐 Pod</text>
  <path d="M218,160 L258,160" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="272" y="88" width="316" height="144" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="430" y="116" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">② 计划评估</text>
  <g transform="translate(292,138)"><rect width="62" height="58" rx="7" fill="#fff" stroke="#1c7ed6"/><rect x="72" width="62" height="58" rx="7" fill="#fff" stroke="#2f9e44"/><rect x="144" width="62" height="58" rx="7" fill="#fff" stroke="#e8890c"/><rect x="216" width="62" height="58" rx="7" fill="#fff" stroke="#8b5cf6"/><text x="31" y="24" text-anchor="middle" font-size="8.5" fill="#1f2328">Scope / PDB</text><text x="31" y="42" text-anchor="middle" font-size="7.2" fill="#57606a">范围 / 零中断</text><text x="103" y="24" text-anchor="middle" font-size="9.5" fill="#1f2328">迁移模拟</text><text x="103" y="42" text-anchor="middle" font-size="8.5" fill="#57606a">调度可行</text><text x="175" y="24" text-anchor="middle" font-size="9.5" fill="#1f2328">中断评分</text><text x="175" y="42" text-anchor="middle" font-size="8.5" fill="#57606a">影响最小</text><text x="247" y="24" text-anchor="middle" font-size="9.5" fill="#1f2328">预算/收益</text><text x="247" y="42" text-anchor="middle" font-size="8.5" fill="#57606a">达到阈值</text></g>
  <text x="430" y="218" text-anchor="middle" font-size="9.5" fill="#57606a">任一约束不满足：不驱逐 Pod，并在状态中记录原因。</text>
  <path d="M598,160 L638,160" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>

  <rect x="652" y="104" width="190" height="112" rx="11" fill="#fff8e8" stroke="#e8890c"/>
  <text x="747" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">③ 审核 status.plan</text>
  <text x="747" y="156" text-anchor="middle" font-size="9.8" fill="#57606a">影响哪些工作负载？迁移多少卡？</text>
  <text x="747" y="175" text-anchor="middle" font-size="9.8" fill="#57606a">计划从哪里到哪里？</text>
  <text x="747" y="194" text-anchor="middle" font-size="9.8" fill="#57606a">预计腾空哪些节点？</text>
  <path d="M852,160 L892,160" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#g)"/>

  <rect x="906" y="104" width="178" height="112" rx="11" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="995" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">④ 新建 Execute</text>
  <text x="995" y="156" text-anchor="middle" font-size="9.8" fill="#57606a">不是修改 DryRun</text>
  <text x="995" y="175" text-anchor="middle" font-size="9.8" fill="#57606a">按实时集群重新规划</text>
  <text x="995" y="194" text-anchor="middle" font-size="9.8" font-weight="700" fill="#2f9e44">通过后才进入驱逐</text>

  <path d="M995,228 L995,264 L830,264 L830,286" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#g)"/>
  <rect x="586" y="300" width="488" height="78" rx="11" fill="#edf9f1" stroke="#2f9e44"/>
  <text x="830" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">⑤ 执行与验证</text>
  <text x="830" y="348" text-anchor="middle" font-size="9.8" fill="#57606a">Eviction → 重建 Pod → nominatedNodeName → Scheduler 实际绑定</text>
  <text x="830" y="366" text-anchor="middle" font-size="9.8" fill="#57606a">status.result 记录实际收益；status.relocations 记录逐 Pod 过程</text>

  <path d="M576,339 L536,339" fill="none" stroke="#1c7ed6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="36" y="286" width="486" height="106" rx="11" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="56" y="314" font-size="12" font-weight="700" fill="#1f2328">评估与执行结果均记录在 RepackRun 状态中</text>
  <rect x="58" y="330" width="204" height="42" rx="7" fill="#fff" stroke="#d0d7de"/>
  <text x="160" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2328">不建议整理</text>
  <text x="160" y="364" text-anchor="middle" font-size="8.8" fill="#57606a">无碎片 / 收益不足 / 当前不可行</text>
  <rect x="278" y="330" width="222" height="42" rx="7" fill="#fff" stroke="#2f9e44"/>
  <text x="389" y="348" text-anchor="middle" font-size="10" font-weight="700" fill="#2f9e44">执行完成</text>
  <text x="389" y="364" text-anchor="middle" font-size="8.8" fill="#57606a">按建议节点完成 / 调度到其他节点且收益已验证</text>
</svg>
