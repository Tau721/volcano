<svg viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" role="img">
  <title>Repack Engine 分层架构与插件扩展点</title>
  <desc>Repack Engine 复用 Volcano Scheduler Cache 和 Session，包括 PDB informer 快照。Runtime 驱动控制器并提供执行原语，Action 是完整业务入口，Lazy Drain Planner 执行通用惰性搜索，场景能力由可组合插件通过回调扩展。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <style>
      .title{fill:#111827;font-size:20px;font-weight:700}.head{fill:#111827;font-size:14px;font-weight:700}.body{fill:#475569;font-size:11px}.small{fill:#64748b;font-size:10px}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.infra{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.engine{fill:#f0fdf4;stroke:#4ade80;stroke-width:1.7}.action{fill:#dcfce7;stroke:#22c55e;stroke-width:1.6}.plugin{fill:#fff7ed;stroke:#fb923c;stroke-width:1.4}.line{fill:none;stroke:#2563eb;stroke-width:1.7;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>

  <text x="600" y="32" text-anchor="middle" class="title">Repack Engine 分层架构与插件扩展点</text>

  <rect x="28" y="72" width="200" height="208" rx="12" class="infra"/>
  <text x="128" y="99" text-anchor="middle" class="head">Kubernetes API</text>
  <rect x="52" y="122" width="152" height="48" rx="8" class="card"/>
  <text x="128" y="141" text-anchor="middle" class="body code">RepackRun</text>
  <text x="128" y="157" text-anchor="middle" class="small">Spec / Status / Journal</text>
  <rect x="52" y="188" width="152" height="66" rx="8" class="card"/>
  <text x="128" y="208" text-anchor="middle" class="body">Node / Pod / PodGroup / PDB</text>
  <text x="128" y="228" text-anchor="middle" class="small">Workload metadata</text>
  <text x="128" y="245" text-anchor="middle" class="small">informer snapshot</text>

  <rect x="28" y="324" width="200" height="180" rx="12" class="infra"/>
  <text x="128" y="351" text-anchor="middle" class="head">Scheduler 基础能力</text>
  <rect x="52" y="374" width="152" height="42" rx="8" class="card"/>
  <text x="128" y="395" text-anchor="middle" class="body code">schedcache</text>
  <rect x="52" y="430" width="152" height="52" rx="8" class="card"/>
  <text x="128" y="450" text-anchor="middle" class="body code">OpenSession</text>
  <text x="128" y="468" text-anchor="middle" class="small">Predicate / NodeOrder</text>

  <rect x="284" y="72" width="540" height="540" rx="14" class="engine"/>
  <text x="554" y="99" text-anchor="middle" class="head">volcano-repack-engine</text>

  <rect x="316" y="124" width="476" height="78" rx="10" class="card"/>
  <text x="554" y="147" text-anchor="middle" class="head">Engine Runtime：控制器驱动与执行原语</text>
  <text x="554" y="170" text-anchor="middle" class="body">informer · workqueue · K=1 gate · status / eviction / placement ports</text>
  <text x="554" y="188" text-anchor="middle" class="small">构造 ActionContext；Planning Session 仅在规划阶段按需打开</text>

  <rect x="316" y="230" width="476" height="82" rx="10" class="action"/>
  <text x="554" y="254" text-anchor="middle" class="head code">Action: repack</text>
  <text x="554" y="278" text-anchor="middle" class="body">阶段恢复 → 规划 → DryRun / Execute → 驱逐 → 落点跟踪 → 终态</text>
  <text x="554" y="298" text-anchor="middle" class="small">单次 RepackRun 的唯一业务入口；具体场景策略由 Plugin 扩展</text>

  <rect x="316" y="340" width="476" height="126" rx="10" class="card"/>
  <text x="554" y="365" text-anchor="middle" class="head">Lazy Drain Planner</text>
  <text x="554" y="391" text-anchor="middle" class="body">一次分类与索引 → 低成本硬过滤 → 0–100 加权评分</text>
  <text x="554" y="414" text-anchor="middle" class="body">按需构造 receiver → 完整 Scheduler 校验 → 首个可行候选</text>
  <text x="554" y="438" text-anchor="middle" class="body">提交增量状态 → 继续下一 Step，直到目标或预算结束</text>
  <text x="554" y="455" text-anchor="middle" class="small">空节点与满卡节点在评分前排除；正确性边界不可由插件关闭</text>

  <rect x="316" y="496" width="476" height="84" rx="10" class="card"/>
  <text x="554" y="520" text-anchor="middle" class="head">Planning Session / Snapshot Adapter</text>
  <text x="554" y="545" text-anchor="middle" class="body code">Snapshot · Predicate · Movable · Score · Receiver · Constraint</text>
  <text x="554" y="565" text-anchor="middle" class="small">插件配置顺序不影响语义；同类扩展点按固定规则组合</text>

  <rect x="870" y="72" width="300" height="540" rx="14" class="plugin"/>
  <text x="1020" y="99" text-anchor="middle" class="head">可组合场景插件</text>

  <rect x="894" y="118" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="137" text-anchor="middle" class="head code">workloadscope</text>
  <text x="1020" y="153" text-anchor="middle" class="small">允许被驱逐的工作负载边界</text>
  <rect x="894" y="172" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="191" text-anchor="middle" class="head code">pdbconstraint</text>
  <text x="1020" y="207" text-anchor="middle" class="small">确定性零中断 PDB 规划过滤</text>
  <rect x="894" y="226" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="245" text-anchor="middle" class="head code">repackbudget</text>
  <text x="1020" y="261" text-anchor="middle" class="small">单次影响工作负载与资源上限</text>
  <rect x="894" y="280" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="299" text-anchor="middle" class="head code">nodeconsolidation</text>
  <text x="1020" y="315" text-anchor="middle" class="small">节点级 FreeableUnit</text>
  <rect x="894" y="334" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="353" text-anchor="middle" class="head code">workloaddisruption</text>
  <text x="1020" y="369" text-anchor="middle" class="small">工作负载、资源量与 Pod 中断成本</text>
  <rect x="894" y="388" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="407" text-anchor="middle" class="head code">gangdisruption</text>
  <text x="1020" y="423" text-anchor="middle" class="small">Gang breach 与受损资源成本</text>
  <rect x="894" y="442" width="252" height="46" rx="8" class="card"/>
  <text x="1020" y="461" text-anchor="middle" class="head code">binpack</text>
  <text x="1020" y="477" text-anchor="middle" class="small">Victim 顺序与 Receiver 优选</text>
  <text x="1020" y="528" text-anchor="middle" class="body">关闭插件只关闭对应策略</text>
  <text x="1020" y="549" text-anchor="middle" class="small">必要 Domain 缺失时配置校验失败</text>

  <path d="M228 164 H314" class="line"/>
  <text x="271" y="150" text-anchor="middle" class="small">事件 / 状态</text>
  <path d="M228 414 H282 C300 414 294 176 314 166" class="line"/>
  <text x="256" y="400" text-anchor="middle" class="small">实时快照</text>
  <path d="M554 202 V228" class="line"/>
  <path d="M554 312 V338" class="line"/>
  <path d="M554 466 V494" class="line"/>
  <path d="M870 342 H794" class="line"/>
  <text x="833" y="327" text-anchor="middle" class="small">注册回调</text>
  <path d="M316 278 C270 278 260 256 228 238" class="line dash"/>
  <text x="271" y="293" text-anchor="middle" class="small">status / Eviction</text>

  <rect x="28" y="638" width="1142" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="599" y="655" text-anchor="middle" class="small">扩展原则：Action 稳定、Planner 通用、Plugin 场景化；新增策略优先通过回调扩展，不复制主流程</text>
</svg>
