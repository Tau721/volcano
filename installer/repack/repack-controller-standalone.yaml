# OPTIONAL: run the RepackRun / RepackPolicy controllers + the nomination
# reconciler as a STANDALONE Deployment instead of the built-in shim inside
# volcano-controller-manager.
#
# IMPORTANT: if you deploy this, you MUST disable the built-in copy, otherwise two
# instances reconcile the same RepackRuns and fight. Disable it by passing
#     --controllers=*,-repack-controller
# to volcano-controller-manager. Do NOT apply repack-controller-rbac.yaml in this
# mode (that one is for the built-in path); this file carries its own SA + role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volcano-repack-controller
  namespace: volcano-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: volcano-repack-controller-standalone
rules:
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackruns"]
    verbs: ["get", "list", "watch", "create", "update", "delete"] # create = RepackPolicy-derived runs; delete = TTL GC / RepackPolicy history recycling
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackruns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"] # onFragAbovePercent fragmentation measurement
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"] # remove the placement gate after nomination
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: volcano-repack-controller-standalone-role
subjects:
  - kind: ServiceAccount
    name: volcano-repack-controller
    namespace: volcano-system
roleRef:
  kind: ClusterRole
  name: volcano-repack-controller-standalone
  apiGroup: rbac.authorization.k8s.io
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: volcano-repack-controller
  namespace: volcano-system
  labels:
    app: volcano-repack-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volcano-repack-controller
  template:
    metadata:
      labels:
        app: volcano-repack-controller
    spec:
      serviceAccountName: volcano-repack-controller
      priorityClassName: system-cluster-critical
      containers:
        - name: volcano-repack-controller
          image: volcanosh/vc-repack-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --logtostderr
            - --leader-elect=true
            - --leader-elect-namespace=volcano-system
            - --repack-execute-cooldown=10m
            - --repack-policy-frag-eval-cycle=10m # >= repack-execute-cooldown
            - -v=3
