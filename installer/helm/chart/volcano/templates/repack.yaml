{{- if .Values.custom.repack_enable }}
{{ $repack_affinity := or .Values.custom.repack_affinity .Values.custom.default_affinity }}
{{ $repack_tolerations := or .Values.custom.repack_tolerations .Values.custom.default_tolerations }}
{{ $repack_sc := or .Values.custom.repack_sc .Values.custom.default_sc }}
{{ $repack_ns := or .Values.custom.repack_ns .Values.custom.default_ns }}
# ---------------------------------------------------------------------------
# volcano-repack-engine — standalone runtime-defragmentation engine. It reuses
# the volcano-scheduler cache + the SAME scheduler-conf (mounted from the
# scheduler ConfigMap), so it sees the cluster exactly as the scheduler does.
# Research preview: disabled by default (custom.repack_enable).
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-repack-configmap
  namespace: {{ .Release.Namespace }}
data:
  repack-engine.conf: |
    {{- if .Values.custom.repack_config_override }}
    {{- .Values.custom.repack_config_override | nindent 4 }}
    {{- else }}
    actions: "repack"
    plugins:
      - name: workloadscope
      - name: pdbconstraint
      - name: repackbudget
      - name: nodeconsolidation
      - name: networktopologyaware
      - name: workloaddisruption
        arguments:
          affectedPodGroupsWeight: 10
          movedResourceWeight: 3
          movedPodsWeight: 1
      - name: gangdisruption
        arguments:
          gangBreachesWeight: 8
          damagedResourceWeight: 6
      - name: binpack
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-repack-engine
  namespace: {{ .Release.Namespace }}
  {{- if .Values.custom.common_labels }}
  labels:
    {{- toYaml .Values.custom.common_labels | nindent 4 }}
  {{- end }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-repack-engine
  {{- if .Values.custom.common_labels }}
  labels:
    {{- toYaml .Values.custom.common_labels | nindent 4 }}
  {{- end }}
rules:
  # --- repack-specific ---
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackruns"]
    verbs: ["get", "list", "watch", "update", "patch"] # patch = placement-active discovery label
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackruns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # --- scheduler-cache read-set (same cluster view as the scheduler) ---
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "services", "replicationcontrollers", "resourcequotas"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch.volcano.sh"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities", "volumeattachments"]
    verbs: ["list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.incubator.k8s.io", "scheduling.volcano.sh"]
    resources: ["queues", "podgroups"]
    verbs: ["get", "list", "watch", "update"] # write/remove the RepackRun placement lease
  - apiGroups: ["nodeinfo.volcano.sh"]
    resources: ["numatopologies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["topology.volcano.sh"]
    resources: ["hypernodes", "hypernodes/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceslices"]
    verbs: ["get", "list", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-repack-engine-role
  {{- if .Values.custom.common_labels }}
  labels:
    {{- toYaml .Values.custom.common_labels | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-repack-engine
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-repack-engine
  apiGroup: rbac.authorization.k8s.io
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ .Release.Name }}-repack-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: volcano-repack-engine
    {{- if or (.Values.custom.repack_labels) (.Values.custom.common_labels) }}
    {{- mustMerge (.Values.custom.repack_labels | default (dict)) (.Values.custom.common_labels | default (dict)) | toYaml | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.custom.repack_engine_replicas }}
  selector:
    matchLabels:
      app: volcano-repack-engine
  template:
    metadata:
      labels:
        app: volcano-repack-engine
        {{- if or (.Values.custom.repack_podLabels) (.Values.custom.common_labels) }}
        {{- mustMerge (.Values.custom.repack_podLabels | default (dict)) (.Values.custom.common_labels | default (dict)) | toYaml | nindent 8 }}
        {{- end }}
    spec:
      {{- if $repack_tolerations }}
      tolerations: {{- toYaml $repack_tolerations | nindent 8 }}
      {{- end }}
      {{- if $repack_ns }}
      nodeSelector: {{- toYaml $repack_ns | nindent 8 }}
      {{- end }}
      {{- if $repack_affinity }}
      affinity:
        {{- toYaml $repack_affinity | nindent 8 }}
      {{- end }}
      {{- if $repack_sc }}
      securityContext:
        {{- toYaml $repack_sc | nindent 8 }}
      {{- end }}
      serviceAccount: {{ .Release.Name }}-repack-engine
      priorityClassName: system-cluster-critical
      {{- if .Values.basic.image_pull_secret }}
      imagePullSecrets:
        - name: {{ .Values.basic.image_pull_secret }}
      {{- end }}
      containers:
        - name: {{ .Release.Name }}-repack-engine
          image: {{ .Values.basic.image_registry }}/{{ .Values.basic.repack_engine_image_name }}:{{ .Values.basic.repack_engine_image_tag_version | default .Values.basic.image_tag_version }}
          imagePullPolicy: {{ .Values.basic.image_pull_policy }}
          args:
            - --logtostderr
            - --scheduler-conf=/volcano.scheduler/{{ base .Values.basic.scheduler_config_file }}
            - --repack-conf=/volcano.repack/repack-engine.conf
            - --leader-elect=true
            - --leader-elect-resource-namespace={{ .Release.Namespace }}
            - --resync-period={{ .Values.custom.repack_schedule_period }}
            - --repack-execute-cooldown={{ .Values.custom.repack_execute_cooldown | default "10m" }}
            - --repack-execution-timeout={{ .Values.custom.repack_execution_timeout | default "10m" }}
            - --repack-default-resource={{ .Values.custom.repack_default_resource }}
            {{- if .Values.custom.repack_plugins }}
            - --repack-plugins={{ join "," .Values.custom.repack_plugins }}
            {{- end }}
            - --enable-healthz=true
            - --healthz-address=:11251
            - --enable-metrics=true
            - --listen-address=:8081
            - -v={{ .Values.custom.repack_log_level | default 3 }}
          ports:
            - containerPort: 11251
              name: healthz
            - containerPort: 8081
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: 11251
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- if .Values.custom.repack_resources }}
          resources:
            {{- toYaml .Values.custom.repack_resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: scheduler-config
              mountPath: /volcano.scheduler
            - name: repack-config
              mountPath: /volcano.repack
      volumes:
        - name: scheduler-config
          configMap:
            # the SAME ConfigMap the volcano-scheduler uses (plugin tiers /
            # predicates), so the engine sees the cluster identically.
            name: {{ .Release.Name }}-scheduler-configmap
        - name: repack-config
          configMap:
            name: {{ .Release.Name }}-repack-configmap
---
# ---------------------------------------------------------------------------
# Additive RBAC for the RepackRun controller + nomination reconciler, which runs
# as the DEFAULT built-in inside volcano-controller-manager. Grants the
# controller-manager's ServiceAccount the repack-specific verbs. (For a
# standalone controller Deployment instead, disable the built-in via
# --controllers=*,-repack-controller and apply installer/repack/repack-controller-standalone.yaml.)
# ---------------------------------------------------------------------------
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-repack-controller
  {{- if .Values.custom.common_labels }}
  labels:
    {{- toYaml .Values.custom.common_labels | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackruns"]
    verbs: ["get", "list", "watch", "update", "delete"] # delete = TTL GC
  - apiGroups: ["repack.volcano.sh"]
    resources: ["repackruns/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"] # remove the placement gate after nomination
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch"] # nomination reconciler writes pod.status.nominatedNodeName
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups"]
    verbs: ["get"] # confirm original deletion before recording a replacement PodGroup
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-repack-controller-role
  {{- if .Values.custom.common_labels }}
  labels:
    {{- toYaml .Values.custom.common_labels | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-controllers
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-repack-controller
  apiGroup: rbac.authorization.k8s.io
{{- end }}
