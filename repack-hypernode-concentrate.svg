<svg viewBox="0 0 1090 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img">
<title>Repack 碎片整理前后 · 节点占用对比</title>
<desc>一个 L2 HyperNode 含 3 个 L1 HyperNode，每个 L1 HyperNode 含 8 个节点。整理前 A/B/C 分别是前 6/6/4 个节点占用；整理后 A 8/8、B 8/8、C 0/8，C 整层腾空。左为整理前，右为整理后。集群中有两个 Job 在等待调度（示意，不实际落位）：Job 1 含 1 组（6 个 Pod）；Job 2 含 3 组（每组 2 个 Pod）。</desc>
<rect width="1090" height="600" fill="#ffffff"/>

<text x="520" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Repack 碎片整理 · 节点占用对比</text>
<text x="520" y="42" text-anchor="middle" font-size="12" fill="#57606a">1 个 L2 HyperNode，含 3 个 L1 HyperNode，每个含 8 节点</text>

